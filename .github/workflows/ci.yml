name: Production checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cafe1-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Verify release integrity
        run: npm run release:guard

      - name: Clean install
        run: npm ci

      - name: Typecheck, lint, test and build
        run: npm run check

      - name: Audit production dependency graph
        run: npm audit --omit=dev --audit-level=high

      - name: Record application evidence
        if: always()
        run: |
          mkdir -p release-evidence
          npm run verify:dependencies -- --output release-evidence/dependency-contract.json
          npm run verify:migrations -- --output release-evidence/migration-integrity.json
          npm run verify:capabilities -- --output release-evidence/software-capabilities.json
          npm run verify:bundle-budget -- --output release-evidence/bundle-budget.json
          npm run release:status -- --output release-evidence/release-status.json

      - name: Upload application evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cafe1-application-evidence-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 30

  database:
    name: Supabase migrations and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: 2.111.0

      - name: Verify immutable migration history
        run: node scripts/verify-migration-integrity.mjs

      - name: Start local database and apply every migration
        run: supabase db start

      - name: Rebuild database from every migration
        run: supabase db reset

      - name: Run database assertions
        run: supabase test db

      - name: Stop local database
        if: always()
        run: supabase stop --no-backup
