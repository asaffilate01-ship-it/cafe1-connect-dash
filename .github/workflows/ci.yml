name: Production checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cafe1-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Typecheck, lint, test and build
        run: npm run check

      - name: Audit production dependency graph
        run: npm audit --omit=dev --audit-level=high

  database:
    name: Supabase migrations and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Rebuild database from every migration
        run: supabase db reset

      - name: Run database assertions
        run: supabase test db
