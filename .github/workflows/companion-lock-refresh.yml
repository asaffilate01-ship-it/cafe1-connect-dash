# Temporary one-shot repair on the Cafe 1 review branch.
# Removed once the regenerated lockfile is reviewed and recorded in GitHub.
name: Companion Expo lockfile reconciliation
on:
  push:
    branches:
      - fix/cafe1-checkout-court-staff-safety-20261101
    paths:
      - .github/workflows/companion-lock-refresh.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: companion/package-lock.json
      - name: Regenerate exact Expo SDK 58 dependency lockfile
        working-directory: companion
        run: |
          npm ci
          npm install --save-exact --ignore-scripts expo@58.0.22 expo-dev-client@58.0.18 expo-sqlite@58.0.15 expo-task-manager@58.0.13
          npm ci
          npx expo install --check
          npm run typecheck
          npm test
          npm run export
      - name: Commit only the dependency manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add companion/package.json companion/package-lock.json
          if git diff --cached --quiet; then
            echo "No Expo dependency updates needed."
          else
            git commit -m "fix(companion): align Expo SDK 58 patch dependencies and lockfile"
            git push origin HEAD:refs/heads/fix/cafe1-checkout-court-staff-safety-20261101
          fi
